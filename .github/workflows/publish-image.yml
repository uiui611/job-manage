# Both images must be published before either deployment is notified.
# The receiver updates registered Deployments; it does not apply manifests or Secrets.
name: Check, publish and deploy container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_IMAGE: ghcr.io/uiui611/job-manage-server
  WORKER_IMAGE: ghcr.io/uiui611/job-manage-worker

jobs:
  frontend:
    name: Check frontend and deployment helper
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run build
      - name: Test deployment notification
        working-directory: .
        run: node --test .github/scripts/notify-deployment.test.mjs

  backend:
    name: Check Rust server and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same Rust 1.99 compiler image as Dockerfile.server and Dockerfile.worker.
    container: rust:bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install process test and lint prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          rustup component add rustfmt clippy
          rustc --version
          python3 --version
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-worker:
    name: Check and package Windows worker
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check externally provided runtimes and Rust tools
        shell: pwsh
        run: |
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonPath = (Get-Command python.exe).Source
          "JOB_TEST_PYTHON=$pythonPath" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo test -p job-protocol -p job-worker --locked
      - run: cargo clippy -p job-protocol -p job-worker --all-targets --locked -- -D warnings
      - run: cargo build -p job-worker --release --locked
      - name: Package worker without execution runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-worker | Out-Null
          Copy-Item target/release/job-worker.exe, LICENSE, docs/windows-worker.md -Destination windows-worker
          (Get-FileHash windows-worker/job-worker.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  job-worker.exe' | Set-Content windows-worker/SHA256SUMS.txt
          ./windows-worker/job-worker.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows x64 worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-worker-windows-x64
          path: windows-worker/
          retention-days: 14
          if-no-files-found: error

  build:
    name: Validate pull request image (${{ matrix.image }})
    if: github.event_name == 'pull_request'
    needs: [frontend, backend, windows-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [server, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=job-manage-${{ matrix.image }}-main

  publish:
    name: Publish main images and request deployment
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend, windows-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ghcr-job-manage-main
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish only the current main commit
        id: current-head
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          head_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            printf '%s\n' 'publish=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'publish=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'Main has advanced; skipping image publication and deployment notification.'
          fi
      - name: Set up Docker Buildx
        if: steps.current-head.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: steps.current-head.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate server image tags and labels
        if: steps.current-head.outputs.publish == 'true'
        id: server-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.SERVER_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,format=long
      - name: Build and publish server image
        if: steps.current-head.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.server-metadata.outputs.tags }}
          labels: ${{ steps.server-metadata.outputs.labels }}
          cache-from: type=gha,scope=job-manage-server-main
          cache-to: type=gha,mode=max,scope=job-manage-server-main
      - name: Generate worker image tags and labels
        if: steps.current-head.outputs.publish == 'true'
        id: worker-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.WORKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,format=long
      - name: Build and publish worker image
        if: steps.current-head.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker-metadata.outputs.tags }}
          labels: ${{ steps.worker-metadata.outputs.labels }}
          cache-from: type=gha,scope=job-manage-worker-main
          cache-to: type=gha,mode=max,scope=job-manage-worker-main
      - name: Request server deployment update
        if: steps.current-head.outputs.publish == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEPLOY_SERVICE_ID: job-manage-server
          DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL || 'https://deploy.mizu-mizu.info/v1/deployments' }}
          DEPLOY_OIDC_AUDIENCE: ${{ vars.DEPLOY_OIDC_AUDIENCE || 'https://deploy.mizu-mizu.info' }}
        run: node .github/scripts/notify-deployment.mjs
      - name: Request worker deployment update
        if: steps.current-head.outputs.publish == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          DEPLOY_SERVICE_ID: job-manage-worker
          DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL || 'https://deploy.mizu-mizu.info/v1/deployments' }}
          DEPLOY_OIDC_AUDIENCE: ${{ vars.DEPLOY_OIDC_AUDIENCE || 'https://deploy.mizu-mizu.info' }}
        run: node .github/scripts/notify-deployment.mjs
